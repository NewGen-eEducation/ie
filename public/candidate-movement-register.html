<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Candidate Movement Register - TGBIE</title><style>@page{size:A4 landscape;margin:6mm}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:15px;background-color:#eef2f5;color:#000}.no-print{background:#fff;padding:20px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1);margin-bottom:25px}.manual-input-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;background:#f1f8e9;padding:15px;border-radius:6px;border:1px solid #c8e6c9;margin-bottom:18px}.input-group{display:flex;flex-direction:column;text-align:left}.input-group label{font-size:11.5px;font-weight:700;color:#2e7d32;margin-bottom:4px}.input-group input,.input-group select{padding:6px 8px;font-size:12px;border:1px solid #a5d6a7;border-radius:4px;outline:0;background:#fff}.input-group input:focus,.input-group select:focus{border-color:#2e7d32;box-shadow:0 0 3px rgba(46,125,50,.3)}.controls-section{margin-top:15px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}.btn{border:none;padding:10px 18px;font-size:13px;font-weight:700;border-radius:4px;cursor:pointer;transition:opacity .2s;color:#fff}.btn:hover{opacity:.9}.btn-gen{background-color:#0277bd}.btn-print{background-color:#2e7d32}.sheet-container{background:#fff;padding:15px;margin-bottom:25px;border-radius:4px;box-shadow:0 0 10px rgba(0,0,0,.08);page-break-after:always}.sheet-container:last-child{page-break-after:auto}.top-branding-bar{display:flex;justify-content:flex-end;align-items:center;border-bottom:1px solid #999;padding-bottom:4px;margin-bottom:8px;font-size:10px}.header-datetime{font-size:10px;color:#333;font-weight:600}.header-titles{text-align:center;margin-bottom:10px}.header-titles h2{margin:0;font-size:15px;text-transform:uppercase;font-weight:700}.header-titles h3{margin:2px 0;font-size:13px;font-weight:700}.header-titles h4{margin:2px 0;font-size:12px;text-decoration:underline}.details-grid{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:4px 12px;margin-bottom:8px;font-size:10.5px;font-weight:700}table{width:100%;border-collapse:collapse!important;text-align:center;border:1.5px solid #000!important;background-color:#fff;margin-bottom:10px;font-size:9.5px;table-layout:fixed}td,th{border:1px solid #000!important;padding:4px 2px;vertical-align:middle;color:#000;word-wrap:break-word;overflow-wrap:break-word}th{background-color:#f2f2f2!important;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}.col-num{font-size:8.5px;font-weight:700;background-color:#eaeaea!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.data-row td{height:28px}.instructions{margin-top:8px;font-size:8.5px;border:1px dashed #555;padding:5px 8px;background-color:#fafafa;line-height:1.4}.instructions ol{margin:2px 0 0 14px;padding:0}.footer-signatures{margin-top:25px;display:flex;justify-content:space-between;align-items:flex-end;font-size:10.5px;font-weight:700}.footer-signatures div{text-align:center;flex:1}@media print{body{background-color:transparent;margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}.no-print{display:none!important}.sheet-container{box-shadow:none;padding:0;margin:0}table{border:1.5px solid #000!important}td,th{border:1px solid #000!important}}</style></head><body><div class=no-print><div style="display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #0d47a1;padding-bottom:6px;margin-bottom:12px"><h3 style=margin:0;color:#0d47a1>NewGen eEducation : TGBIE &mdash; Candidate Movement Register Generator</h3><span id=live-clock style=font-size:12px;font-weight:700;color:#444></span></div><p style=font-size:12px;color:#555;margin-bottom:15px>Generate the official <strong>Candidate Movement Register</strong> to log candidates leaving examination halls temporarily for nature calls / drinking water under invigilator supervision.</p><div class=manual-input-grid><div class=input-group><label for=man-exam-type>Exam Type</label><select id=man-exam-type><option value=IPE>IPE (Annual)</option><option value=IPASE>IPASE (Advanced Supplementary)</option></select></div><div class=input-group><label for=man-exam-month-year>Exam Month &amp; Year</label><input id=man-exam-month-year placeholder="e.g., MARCH 2026"></div><div class=input-group><label for=man-centre-code>Centre Code</label><input id=man-centre-code placeholder="e.g., 44***"></div><div class=input-group><label for=man-college-name>Centre Name / College</label><input id=man-college-name placeholder="e.g., Govt. Junior College,___"></div><div class=input-group><label for=man-dist-name>District</label><input id=man-dist-name placeholder="e.g., Bhadradri Kothagudem (44)"></div><div class=input-group><label for=man-exam-date>Date of Exam</label><input id=man-exam-date placeholder=DD/MM/YYYY></div><div class=input-group><label for=man-session-type>Session</label><select id=man-session-type><option value="Forenoon (9:00 AM - 12:00 PM)">Forenoon (9:00 AM - 12:00 PM)</option><option value="Afternoon (2:30 PM - 5:30 PM)">Afternoon (2:30 PM - 5:30 PM)</option></select></div><div class=input-group><label for=man-room-no>Room No. (Optional)</label><input id=man-room-no placeholder="e.g., Room 01 / All Rooms"></div></div><div class=controls-section><button class="btn btn-gen" onclick=generateRegister()>Generate Movement Register</button><button class="btn btn-print" onclick=window.print()>Print Register</button></div></div><div id=output-container></div><script>function updateClock(){const e=(new Date).toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"medium"}),t=document.getElementById("live-clock");t&&(t.innerText=e)}function getFormattedTimestamp(){const e=new Date;return`${e.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})} | ${e.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:!0})}`}function getMetaInputs(){const e=document.getElementById("man-exam-type").value.trim(),t=document.getElementById("man-exam-month-year").value.trim(),n=document.getElementById("man-centre-code").value.trim(),o=document.getElementById("man-college-name").value.trim(),i=document.getElementById("man-dist-name").value.trim(),a=document.getElementById("man-session-type").value,r=document.getElementById("man-room-no").value.trim();return{exam:`${e} ${t}`.trim(),centreCode:n||"______",collegeName:o||"________________________________________________",dist:i||"________________",session:a,roomNo:r||"______________",timestamp:getFormattedTimestamp()}}function renderRegisterHtml(e,t){let n="";for(let e=1;e<=15;e++)n+='\n            <tr class="data-row">\n                <td></td>\n                <td></td>\n                <td></td>\n                <td></td>\n                <td></td>\n                <td></td>\n                <td></td>\n                <td></td>\n                <td></td>\n                <td></td>\n            </tr>';return`\n        <div class="sheet-container">\n            <div class="top-branding-bar">\n                <div class="header-datetime"><strong>Generated on:</strong> ${t.timestamp}</div>\n            </div>\n            <div class="header-titles">\n                <h2>Telangana Board of Intermediate Education, Hyderabad</h2>\n                <h3>${t.exam.toUpperCase()}</h3>\n                <h4>CANDIDATE MOVEMENT REGISTER (NATURE CALLS / TEMPORARY ABSENCE)</h4>\n            </div>\n            <div class="details-grid">\n                <div><strong>Centre Code:</strong> ${t.centreCode}</div>\n                <div><strong>District:</strong> ${t.dist}</div>\n                <div><strong>Date of Exam:</strong> ${e||"____________________"}</div>\n                <div><strong>Session:</strong> ${t.session}</div>\n                <div style="grid-column: span 2;"><strong>Name of the Centre:</strong> ${t.collegeName}</div>\n                <div><strong>Room No. / Hall:</strong> ${t.roomNo}</div>\n                <div><strong>Subject / Paper:</strong> ____________________</div>\n            </div>\n            <table>\n                <colgroup>\n                    <col style="width: 5%;">\n                    <col style="width: 12%;">\n                    <col style="width: 15%;">\n                    <col style="width: 8%;">\n                    <col style="width: 8%;">\n                    <col style="width: 7%;">\n                    <col style="width: 13%;">\n                    <col style="width: 10%;">\n                    <col style="width: 11%;">\n                    <col style="width: 11%;">\n                </colgroup>\n                <thead>\n                    <tr>\n                        <th>Room<br>No.</th>\n                        <th>Registered No.<br><span style="font-size:7.5px; font-weight:normal;">(Hall Ticket No.)</span></th>\n                        <th>Name of the Candidate</th>\n                        <th>Time of<br>Leaving Hall<br><span style="font-size:7.5px; font-weight:normal;">(Out Time)</span></th>\n                        <th>Time of<br>Return to Hall<br><span style="font-size:7.5px; font-weight:normal;">(In Time)</span></th>\n                        <th>Total Time<br>Spent Out<br><span style="font-size:7.5px; font-weight:normal;">(Minutes)</span></th>\n                        <th>Purpose of Leaving Hall<br><span style="font-size:7.5px; font-weight:normal;">(Washroom / Drinking Water / Medical)</span></th>\n                        <th>Name of Escort /<br>Attender Accompanying</th>\n                        <th>Signature of the Candidate<br><span style="font-size:7.5px; font-weight:normal;">(Upon Return)</span></th>\n                        <th>Signature of the<br>Room Invigilator</th>\n                    </tr>\n                    <tr>\n                        <th class="col-num">(1)</th>\n                        <th class="col-num">(2)</th>\n                        <th class="col-num">(3)</th>\n                        <th class="col-num">(4)</th>\n                        <th class="col-num">(5)</th>\n                        <th class="col-num">(6)</th>\n                        <th class="col-num">(7)</th>\n                        <th class="col-num">(8)</th>\n                        <th class="col-num">(9)</th>\n                        <th class="col-num">(10)</th>\n                    </tr>\n                </thead>\n                <tbody>\n                    ${n}\n                </tbody>\n            </table>\n            <div class="instructions">\n                <strong>Important Instructions for Chief Superintendent, Departmental Officer &amp; Invigilators:</strong>\n                <ol>\n                    <li><strong>Time Restrictions:</strong> Candidates must <strong>NOT</strong> be permitted to leave the examination hall during the first hour and the last half-hour of the examination, except in emergency medical conditions.</li>\n                    <li><strong>Single Candidate Policy:</strong> Only <strong>one candidate</strong> at a time from a room shall be allowed to leave for nature calls / washroom.</li>\n                    <li><strong>Escort Mandatory:</strong> A designated attender/reliever must accompany the candidate to ensure they do not communicate with outsiders or carry any prohibited material back into the examination hall.</li>\n                    <li><strong>Answer Booklet Custody:</strong> Before leaving the desk, the candidate must place their 24-page answer booklet upside down in the custody of the room invigilator.</li>\n                    <li><strong>Logging &amp; Frisking:</strong> The exact Out-Time and In-Time must be entered in this register, and the candidate must sign upon return after being frisked before entering the room.</li>\n                </ol>\n            </div>\n            <div class="footer-signatures">\n                <div>Signature of the Room Invigilator</div>\n                <div>Signature of the Departmental Officer (D.O.)</div>\n                <div>Signature of the Chief Superintendent (C.S.)</div>\n            </div>\n        </div>`}function generateRegister(){const e=getMetaInputs(),t=document.getElementById("man-exam-date").value.trim();document.getElementById("output-container").innerHTML=renderRegisterHtml(t,e)}setInterval(updateClock,1e3),updateClock(),window.addEventListener("DOMContentLoaded",(()=>{generateRegister()}))</script></body></html>
