<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Room-wise Allotment & Absentees Register - TGBIE</title><style>@page{size:A4 landscape;margin:6mm}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:15px;background-color:#eef2f5;color:#000}.no-print{background:#fff;padding:20px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1);margin-bottom:25px}.manual-input-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;background:#f1f8e9;padding:15px;border-radius:6px;border:1px solid #c8e6c9;margin-bottom:18px}.input-group{display:flex;flex-direction:column;text-align:left}.input-group label{font-size:11.5px;font-weight:700;color:#2e7d32;margin-bottom:4px}.input-group input,.input-group select{padding:6px 8px;font-size:12px;border:1px solid #a5d6a7;border-radius:4px;outline:0;background:#fff}.input-group input:focus,.input-group select:focus{border-color:#2e7d32;box-shadow:0 0 3px rgba(46,125,50,.3)}.controls-section{margin-top:15px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}.btn{border:none;padding:10px 18px;font-size:13px;font-weight:700;border-radius:4px;cursor:pointer;transition:opacity .2s;color:#fff}.btn:hover{opacity:.9}.btn-date{background-color:#0277bd}.btn-print{background-color:#2e7d32}.sheet-container{background:#fff;padding:15px;margin-bottom:25px;border-radius:4px;box-shadow:0 0 10px rgba(0,0,0,.08);page-break-after:always}.sheet-container:last-child{page-break-after:auto}.top-branding-bar{display:flex;justify-content:flex-end;align-items:center;border-bottom:1px solid #999;padding-bottom:4px;margin-bottom:8px;font-size:10px}.header-datetime{font-size:10px;color:#333;font-weight:600}.header-titles{text-align:center;margin-bottom:10px}.header-titles h2{margin:0;font-size:15px;text-transform:uppercase;font-weight:700}.header-titles h3{margin:2px 0;font-size:13px;font-weight:700}.header-titles h4{margin:2px 0;font-size:12px;text-decoration:underline}.details-grid{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:4px 12px;margin-bottom:8px;font-size:10.5px;font-weight:700}table{width:100%;border-collapse:collapse!important;text-align:center;border:1.5px solid #000!important;background-color:#fff;margin-bottom:10px;font-size:9px;table-layout:fixed}td,th{border:1px solid #000!important;padding:3.5px 1.5px;vertical-align:middle;color:#000;word-wrap:break-word;overflow-wrap:break-word}th{background-color:#f2f2f2!important;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}.col-num{font-size:8px;font-weight:700;background-color:#eaeaea!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.row-room1 td{height:48px!important;vertical-align:top}.row-normal td{height:24px}.total-row td{background-color:#e0f2fe!important;font-weight:700;border-top:2px solid #000!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.instructions{margin-top:8px;font-size:8.5px;border:1px dashed #555;padding:5px 8px;background-color:#fafafa;line-height:1.4}.instructions ol{margin:2px 0 0 14px;padding:0}.footer-signatures{margin-top:20px;display:flex;justify-content:space-between;align-items:flex-end;font-size:10.5px;font-weight:700}.footer-signatures div{text-align:center;flex:1}@media print{body{background-color:transparent;margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}.no-print{display:none!important}.sheet-container{box-shadow:none;padding:0;margin:0}table{border:1.5px solid #000!important}td,th{border:1px solid #000!important}}</style></head><body><div class=no-print><div style="display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #0d47a1;padding-bottom:6px;margin-bottom:12px"><h3 style=margin:0;color:#0d47a1>NewGen eEducation : TGBIE &mdash; Room-wise Allotment &amp; Absentees Register Generator</h3><span id=live-clock style=font-size:12px;font-weight:700;color:#444></span></div><p style=font-size:12px;color:#555;margin-bottom:15px>Fill in Centre &amp; Exam details below to generate the official <strong>Room-wise Allotment &amp; Absentees Register</strong> with customizable session timing.</p><div class=manual-input-grid><div class=input-group><label for=man-exam-type>Exam Type</label><select id=man-exam-type><option value=IPE>IPE (Annual)</option><option value=IPASE>IPASE (Advanced Supplementary)</option></select></div><div class=input-group><label for=man-exam-month-year>Exam Month &amp; Year</label><input id=man-exam-month-year placeholder="e.g., MARCH 2026"></div><div class=input-group><label for=man-centre-code>Centre Code</label><input id=man-centre-code placeholder="e.g., 44000"></div><div class=input-group><label for=man-college-name>Centre Name / College</label><input id=man-college-name placeholder="e.g., Govt. Junior College,______"></div><div class=input-group><label for=man-dist-name>District</label><input id=man-dist-name placeholder="e.g., Bhadradri Kothagudem (44)"></div><div class=input-group><label for=man-exam-date>Date of Exam</label><input id=man-exam-date placeholder=DD/MM/YYYY></div><div class=input-group><label for=man-session-type>Session</label><select id=man-session-type><option value="Forenoon (9:00 AM - 12:00 PM)">Forenoon (9:00 AM - 12:00 PM)</option><option value="Afternoon (2:30 PM - 5:30 PM)">Afternoon (2:30 PM - 5:30 PM)</option></select></div><div class=input-group><label for=man-stream-type>Stream / Year</label><select id=man-stream-type><option value="General - 1st Year">General - 1st Year</option><option value="General - 2nd Year">General - 2nd Year</option><option value="Vocational - 1st Year">Vocational - 1st Year</option><option value="Vocational - 2nd Year">Vocational - 2nd Year</option><option value="Combined All Streams">Combined All Streams</option></select></div></div><div class=controls-section><button class="btn btn-date" onclick=generateBlankDaySheet()>Generate Register Sheet</button><button class="btn btn-print" onclick=window.print()>Print Register</button></div></div><div id=output-container></div><script>function updateClock(){const t=(new Date).toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"medium"}),e=document.getElementById("live-clock");e&&(e.innerText=t)}function getFormattedTimestamp(){const t=new Date;return`${t.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})} | ${t.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:!0})}`}function getMetaInputs(){const t=document.getElementById("man-exam-type").value.trim(),e=document.getElementById("man-exam-month-year").value.trim(),n=document.getElementById("man-centre-code").value.trim(),o=document.getElementById("man-college-name").value.trim(),s=document.getElementById("man-dist-name").value.trim(),d=document.getElementById("man-session-type").value,r=document.getElementById("man-stream-type").value;return{exam:`${t} ${e}`.trim(),centreCode:n||"______",collegeName:o||"________________________________________________",dist:s||"________________",session:d,stream:r,timestamp:getFormattedTimestamp()}}function renderRoomSheet(t,e){let n="";n+='\n        <tr class="row-room1">\n            <td></td>\n            <td></td>\n            <td></td>\n            <td></td><td></td><td></td>\n            <td></td><td></td>\n            <td></td>\n            <td></td>\n            <td></td>\n            <td></td>\n            <td></td>\n            <td></td>\n        </tr>';for(let t=2;t<=14;t++)n+='\n            <tr class="row-normal">\n                <td></td>\n                <td></td>\n                <td></td>\n                <td></td><td></td><td></td>\n                <td></td><td></td>\n                <td></td>\n                <td></td>\n                <td></td>\n                <td></td>\n                <td></td>\n                <td></td>\n            </tr>';n+='\n        <tr class="total-row">\n            <td colspan="2" style="text-align: right; padding-right: 6px;">TOTAL:</td>\n            <td></td>\n            <td></td><td></td><td></td>\n            <td></td><td></td>\n            <td></td>\n            <td></td>\n            <td></td>\n            <td></td>\n            <td></td>\n            <td></td>\n        </tr>';const o=e.session.includes("Afternoon")?"3:00 PM":"9:30 AM",s=e.session.includes("Afternoon")?"2:15 PM":"8:45 AM";return`\n        <div class="sheet-container">\n            <div class="top-branding-bar">\n                <div class="header-datetime"><strong>Generated on:</strong> ${e.timestamp}</div>\n            </div>\n            <div class="header-titles">\n                <h2>Telangana Board of Intermediate Education, Hyderabad</h2>\n                <h3>${e.exam.toUpperCase()}</h3>\n                <h4>ROOM-WISE ALLOTMENT &amp; ABSENTEES REGISTER (RETURNED BEFORE ${o})</h4>\n            </div>\n            <div class="details-grid">\n                <div><strong>Centre Code:</strong> ${e.centreCode}</div>\n                <div><strong>District:</strong> ${e.dist}</div>\n                <div><strong>Date of Exam:</strong> ${t||"____________________"}</div>\n                <div><strong>Session:</strong> ${e.session}</div>\n                <div style="grid-column: span 2;"><strong>Name of the Centre:</strong> ${e.collegeName}</div>\n                <div><strong>Stream / Year:</strong> ${e.stream}</div>\n                <div><strong>Declared Set No.:</strong> ______________</div>\n            </div>\n            <table>\n                <colgroup>\n                    <col style="width: 3.5%;">\n                    <col style="width: 14%;">\n                    <col style="width: 4%;">\n                    <col style="width: 4%;">\n                    <col style="width: 6.5%;">\n                    <col style="width: 6.5%;">\n                    <col style="width: 4%;">\n                    <col style="width: 4%;">\n                    <col style="width: 16%;">\n                    <col style="width: 5.5%;">\n                    <col style="width: 5.5%;">\n                    <col style="width: 5.5%;">\n                    <col style="width: 10%;">\n                    <col style="width: 11%;">\n                </colgroup>\n                <thead>\n                    <tr>\n                        <th rowspan="2">Room<br>No.</th>\n                        <th rowspan="2">Name of the Invigilator<br><span style="font-size:7.5px; font-weight:normal;">(Assistant Superintendent)</span></th>\n                        <th rowspan="2">No. of<br>Cand.<br>Allot.</th>\n                        <th colspan="3">Answer Booklets Issued</th>\n                        <th colspan="2">Attendance</th>\n                        <th rowspan="2">Registered Numbers of Absentees</th>\n                        <th colspan="3">Material Returned to CS/DO at ${o}</th>\n                        <th rowspan="2">Signature of<br>Invigilator</th>\n                        <th rowspan="2">Sig. of CS / DO<br><span style="font-size:7.5px; font-weight:normal;">(Token of Receipt)</span></th>\n                    </tr>\n                    <tr>\n                        <th>Total</th>\n                        <th>From Sl. No.</th>\n                        <th>To Sl. No.</th>\n                        <th>Present</th>\n                        <th>Absent</th>\n                        <th>Unused<br>A.B. (Qty)</th>\n                        <th>Abs. OMR<br>Sheets (Qty)</th>\n                        <th>Abs. Q.P.<br>Copies (Qty)</th>\n                    </tr>\n                    <tr>\n                        <th class="col-num">(1)</th>\n                        <th class="col-num">(2)</th>\n                        <th class="col-num">(3)</th>\n                        <th class="col-num">(4)</th>\n                        <th class="col-num">(5)</th>\n                        <th class="col-num">(6)</th>\n                        <th class="col-num">(7)</th>\n                        <th class="col-num">(8)</th>\n                        <th class="col-num">(9)</th>\n                        <th class="col-num">(10)</th>\n                        <th class="col-num">(11)</th>\n                        <th class="col-num">(12)</th>\n                        <th class="col-num">(13)</th>\n                        <th class="col-num">(14)</th>\n                    </tr>\n                </thead>\n                <tbody>\n                    ${n}\n                </tbody>\n            </table>\n            <div class="instructions">\n                <strong>Instructions for Chief Superintendent, Departmental Officer &amp; Assistant Superintendents:</strong>\n                <ol>\n                    <li>Seating arrangements and room allotment of candidates must be strictly as per <strong>Centre Nominal Rolls (CNR)</strong> and not as per D-Form. Room allotment to Invigilators must be finalized daily through <strong>lottery system</strong>.</li>\n                    <li>Invigilators must distribute Answer Booklets at <strong>${s}</strong> only after verifying and retaining candidates' Hall Tickets. Under no circumstances should Answer Booklets be placed on desks of absentees.</li>\n                    <li>At <strong>${o}</strong> sharp, the Chief Superintendent/DO shall collect back all <strong>Unused Answer Books, Absentees' OMR Bar-coded Sheets, and Question Papers</strong> from each room and sign as token of receipt.</li>\n                    <li>Unused answer booklets of absentees returned on Day 1 (broken serial numbers) must be re-allotted to <strong>Room 1</strong> on the subsequent day to be exhausted first.</li>\n                </ol>\n            </div>\n            <div class="footer-signatures">\n                <div>Signature of the Departmental Officer (D.O.)</div>\n                <div>Signature of the Additional Chief Superintendent</div>\n                <div>Signature of the Chief Superintendent (C.S.)</div>\n            </div>\n        </div>`}function generateBlankDaySheet(){const t=getMetaInputs(),e=document.getElementById("man-exam-date").value.trim();document.getElementById("output-container").innerHTML=renderRoomSheet(e,t)}setInterval(updateClock,1e3),updateClock(),window.addEventListener("DOMContentLoaded",(()=>{generateBlankDaySheet()}))</script></body></html>
