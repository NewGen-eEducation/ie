<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Errata Register - TGBIE</title><style>@page{size:A4 landscape;margin:6mm}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:15px;background-color:#eef2f5;color:#000}.no-print{background:#fff;padding:20px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1);margin-bottom:25px}.manual-input-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;background:#f1f8e9;padding:15px;border-radius:6px;border:1px solid #c8e6c9;margin-bottom:18px}.input-group{display:flex;flex-direction:column;text-align:left}.input-group label{font-size:11.5px;font-weight:700;color:#2e7d32;margin-bottom:4px}.input-group input,.input-group select{padding:6px 8px;font-size:12px;border:1px solid #a5d6a7;border-radius:4px;outline:0;background:#fff}.input-group input:focus,.input-group select:focus{border-color:#2e7d32;box-shadow:0 0 3px rgba(46,125,50,.3)}.controls-section{margin-top:15px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}.btn{border:none;padding:10px 18px;font-size:13px;font-weight:700;border-radius:4px;cursor:pointer;transition:opacity .2s;color:#fff}.btn:hover{opacity:.9}.btn-date{background-color:#0277bd}.btn-print{background-color:#2e7d32}.sheet-container{background:#fff;padding:15px;margin-bottom:25px;border-radius:4px;box-shadow:0 0 10px rgba(0,0,0,.08);page-break-after:always}.sheet-container:last-child{page-break-after:auto}.top-branding-bar{display:flex;justify-content:flex-end;align-items:center;border-bottom:1px solid #999;padding-bottom:4px;margin-bottom:8px;font-size:10px}.header-datetime{font-size:10px;color:#333;font-weight:600}.header-titles{text-align:center;margin-bottom:10px}.header-titles h2{margin:0;font-size:15px;text-transform:uppercase;font-weight:700}.header-titles h3{margin:2px 0;font-size:13px;font-weight:700}.header-titles h4{margin:2px 0;font-size:12px;text-decoration:underline}.details-grid{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:4px 12px;margin-bottom:8px;font-size:10.5px;font-weight:700}table{width:100%;border-collapse:collapse!important;text-align:center;border:1.5px solid #000!important;background-color:#fff;margin-bottom:10px;font-size:9.5px;table-layout:fixed}td,th{border:1px solid #000!important;padding:4px 2px;vertical-align:middle;color:#000;word-wrap:break-word;overflow-wrap:break-word}th{background-color:#f2f2f2!important;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}.col-num{font-size:8.5px;font-weight:700;background-color:#eaeaea!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.data-row td{height:28px}.instructions{margin-top:8px;font-size:8.5px;border:1px dashed #555;padding:5px 8px;background-color:#fafafa;line-height:1.4}.instructions ol{margin:2px 0 0 14px;padding:0}.footer-signatures{margin-top:25px;display:flex;justify-content:space-between;align-items:flex-end;font-size:10.5px;font-weight:700}.footer-signatures div{text-align:center;flex:1}@media print{body{background-color:transparent;margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}.no-print{display:none!important}.sheet-container{box-shadow:none;padding:0;margin:0}table{border:1.5px solid #000!important}td,th{border:1px solid #000!important}}</style></head><body><div class=no-print><div style="display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #0d47a1;padding-bottom:6px;margin-bottom:12px"><h3 style=margin:0;color:#0d47a1>NewGen eEducation : TGBIE &mdash; Errata Register Generator (Format 2 - Room Wise Acknowledgment)</h3><span id=live-clock style=font-size:12px;font-weight:700;color:#444></span></div><p style=font-size:12px;color:#555;margin-bottom:15px>Generate the official <strong>Errata Register</strong> to record Board question paper corrections, time of receipt, circulated examination rooms, and room invigilators' acknowledgment signatures.</p><div class=manual-input-grid><div class=input-group><label for=man-exam-type>Exam Type</label><select id=man-exam-type><option value=IPE>IPE (Annual)</option><option value=IPASE>IPASE (Advanced Supplementary)</option></select></div><div class=input-group><label for=man-exam-month-year>Exam Month &amp; Year</label><input id=man-exam-month-year placeholder="e.g., MARCH 2026"></div><div class=input-group><label for=man-centre-code>Centre Code</label><input id=man-centre-code placeholder="e.g., 44***"></div><div class=input-group><label for=man-college-name>Centre Name / College</label><input id=man-college-name placeholder="e.g., Govt. Junior College, _____"></div><div class=input-group><label for=man-dist-name>District</label><input id=man-dist-name placeholder="e.g., Bhadradri Kothagudem (44)"></div><div class=input-group><label for=man-exam-date>Date of Exam</label><input id=man-exam-date placeholder=DD/MM/YYYY></div><div class=input-group><label for=man-session-type>Session</label><select id=man-session-type><option value="Forenoon (9:00 AM - 12:00 PM)">Forenoon (9:00 AM - 12:00 PM)</option><option value="Afternoon (2:30 PM - 5:30 PM)">Afternoon (2:30 PM - 5:30 PM)</option></select></div><div class=input-group><label for=man-subject-day>Subject of the Day</label><input id=man-subject-day placeholder="e.g., Mathematics Paper-IA / Botany-I"></div></div><div class=controls-section><button class="btn btn-date" onclick=generateErrataRegister()>Generate Errata Register</button><button class="btn btn-print" onclick=window.print()>Print Register</button></div></div><div id=output-container></div><script>function updateClock(){const e=(new Date).toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"medium"}),t=document.getElementById("live-clock");t&&(t.innerText=e)}function getFormattedTimestamp(){const e=new Date;return`${e.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})} | ${e.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:!0})}`}function getMetaInputs(){const e=document.getElementById("man-exam-type").value.trim(),t=document.getElementById("man-exam-month-year").value.trim(),n=document.getElementById("man-centre-code").value.trim(),o=document.getElementById("man-college-name").value.trim(),i=document.getElementById("man-dist-name").value.trim(),r=document.getElementById("man-session-type").value,a=document.getElementById("man-subject-day").value.trim();return{exam:`${e} ${t}`.trim(),centreCode:n||"______",collegeName:o||"________________________________________________",dist:i||"________________",session:r,subject:a||"____________________________________",timestamp:getFormattedTimestamp()}}function renderRegisterHtml(e,t){let n="";for(let e=1;e<=14;e++)n+='
            <tr class="data-row">
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
            </tr>';return`
        <div class="sheet-container">
            <div class="top-branding-bar">
                <div class="header-datetime"><strong>Generated on:</strong> ${t.timestamp}</div>
            </div>
            <div class="header-titles">
                <h2>Telangana Board of Intermediate Education, Hyderabad</h2>
                <h3>${t.exam.toUpperCase()}</h3>
                <h4>ERRATA REGISTER (QUESTION PAPER CORRECTIONS &amp; ROOM ACKNOWLEDGMENT)</h4>
            </div>

            <div class="details-grid">
                <div><strong>Centre Code:</strong> ${t.centreCode}</div>
                <div><strong>District:</strong> ${t.dist}</div>
                <div><strong>Date of Exam:</strong> ${e||"____________________"}</div>
                <div><strong>Session:</strong> ${t.session}</div>
                <div style="grid-column: span 2;"><strong>Name of the Centre:</strong> ${t.collegeName}</div>
                <div style="grid-column: span 2;"><strong>Subject(s) of the Day:</strong> ${t.subject}</div>
            </div>

            <table>
                <colgroup>
                    <col style="width: 5%;">  <!-- Room No -->
                    <col style="width: 15%;"> <!-- Invigilator Name -->
                    <col style="width: 12%;"> <!-- Subject & QP Code -->
                    <col style="width: 8%;">  <!-- Medium & Set -->
                    <col style="width: 10%;"> <!-- Time Received / Informed -->
                    <col style="width: 25%;"> <!-- Nature of Errata / Correction Details -->
                    <col style="width: 7%;">  <!-- Candidates Informed (Qty) -->
                    <col style="width: 9%;">  <!-- Signature of Invigilator -->
                    <col style="width: 9%;">  <!-- Remarks / CS DO Initials -->
                </colgroup>
                <thead>
                    <tr>
                        <th>Room<br>No.</th>
                        <th>Name of the Invigilator<br><span style="font-size:7.5px; font-weight:normal;">(Asst. Superintendent)</span></th>
                        <th>Subject &amp;<br>Q.P. Code</th>
                        <th>Medium<br>&amp; Set No.</th>
                        <th>Time Received<br>&amp; Circulated</th>
                        <th>Details of Errata / Correction Communicated by TGBIE<br><span style="font-size:7.5px; font-weight:normal;">(Question No. / Section / Text Correction)</span></th>
                        <th>No. of<br>Candidates<br>Informed</th>
                        <th>Signature of the<br>Invigilator<br><span style="font-size:7.5px; font-weight:normal;">(Acknowledgment)</span></th>
                        <th>Remarks /<br>Attestation<br><span style="font-size:7.5px; font-weight:normal;">(CS / DO)</span></th>
                    </tr>
                    <tr>
                        <th class="col-num">(1)</th>
                        <th class="col-num">(2)</th>
                        <th class="col-num">(3)</th>
                        <th class="col-num">(4)</th>
                        <th class="col-num">(5)</th>
                        <th class="col-num">(6)</th>
                        <th class="col-num">(7)</th>
                        <th class="col-num">(8)</th>
                        <th class="col-num">(9)</th>
                    </tr>
                </thead>
                <tbody>
                    ${n}
                </tbody>
            </table>

            <div class="instructions">
                <strong>Important Instructions for Chief Superintendent, Departmental Officer &amp; Assistant Superintendents:</strong>
                <ol>
                    <li><strong>Mandatory Maintenance:</strong> As per Board instructions, an <strong>Errata Register</strong> must be maintained Day-wise, Subject-wise, and Medium-wise for all corrections communicated by TGBIE.</li>
                    <li><strong>Immediate Circulation:</strong> As soon as any errata/correction message is received from the Board/Control Room, it must be entered immediately into this register and circulated to all examination rooms without delay.</li>
                    <li><strong>Announcement to Candidates:</strong> Invigilators must clearly announce the errata to all candidates in their respective rooms, write the correction clearly on the blackboard, and record their acknowledgment signature with time in this register.</li>
                    <li><strong>Verification &amp; Filing:</strong> The Chief Superintendent and Departmental Officer must ensure that all room invigilators handling the subject have signed before closing the register for the session.</li>
                </ol>
            </div>

            <div class="footer-signatures">
                <div>Signature of the Departmental Officer (D.O.)</div>
                <div>Signature of the Additional Chief Superintendent</div>
                <div>Signature of the Chief Superintendent (C.S.)</div>
            </div>
        </div>`}function generateErrataRegister(){const e=getMetaInputs(),t=document.getElementById("man-exam-date").value.trim();document.getElementById("output-container").innerHTML=renderRegisterHtml(t,e)}setInterval(updateClock,1e3),updateClock(),window.addEventListener("DOMContentLoaded",(()=>{generateErrataRegister()}))</script></body></html>
