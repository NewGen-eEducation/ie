<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Malpractice Cases Register - TGBIE</title><style>@page{size:A4 landscape;margin:6mm}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:15px;background-color:#eef2f5;color:#000}.no-print{background:#fff;padding:20px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1);margin-bottom:25px}.manual-input-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;background:#f1f8e9;padding:15px;border-radius:6px;border:1px solid #c8e6c9;margin-bottom:18px}.input-group{display:flex;flex-direction:column;text-align:left}.input-group label{font-size:11.5px;font-weight:700;color:#2e7d32;margin-bottom:4px}.input-group input,.input-group select{padding:6px 8px;font-size:12px;border:1px solid #a5d6a7;border-radius:4px;outline:0;background:#fff}.input-group input:focus,.input-group select:focus{border-color:#2e7d32;box-shadow:0 0 3px rgba(46,125,50,.3)}.controls-section{margin-top:15px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}.btn{border:none;padding:10px 18px;font-size:13px;font-weight:700;border-radius:4px;cursor:pointer;transition:opacity .2s;color:#fff}.btn:hover{opacity:.9}.btn-gen{background-color:#c62828}.btn-print{background-color:#2e7d32}.sheet-container{background:#fff;padding:15px;margin-bottom:25px;border-radius:4px;box-shadow:0 0 10px rgba(0,0,0,.08);page-break-after:always}.sheet-container:last-child{page-break-after:auto}.top-branding-bar{display:flex;justify-content:flex-end;align-items:center;border-bottom:1px solid #999;padding-bottom:4px;margin-bottom:8px;font-size:10px}.header-datetime{font-size:10px;color:#333;font-weight:600}.header-titles{text-align:center;margin-bottom:10px}.header-titles h2{margin:0;font-size:15px;text-transform:uppercase;font-weight:700}.header-titles h3{margin:2px 0;font-size:13px;font-weight:700}.header-titles h4{margin:2px 0;font-size:12px;text-decoration:underline;color:#b71c1c}.details-grid{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:4px 15px;margin-bottom:8px;font-size:10.5px;font-weight:700}table{width:100%;border-collapse:collapse!important;text-align:center;border:1.5px solid #000!important;background-color:#fff;margin-bottom:10px;font-size:9px;table-layout:fixed}td,th{border:1px solid #000!important;padding:4px 2px;vertical-align:middle;color:#000;word-wrap:break-word;overflow-wrap:break-word}th{background-color:#f2f2f2!important;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}.col-num{font-size:8px;font-weight:700;background-color:#eaeaea!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.data-row td{height:32px}.instructions{margin-top:8px;font-size:8.5px;border:1px dashed #555;padding:5px 8px;background-color:#fafafa;line-height:1.4}.instructions ol{margin:2px 0 0 14px;padding:0}.footer-signatures{margin-top:25px;display:flex;justify-content:space-between;align-items:flex-end;font-size:10.5px;font-weight:700}.footer-signatures div{text-align:center;flex:1}@media print{body{background-color:transparent;margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}.no-print{display:none!important}.sheet-container{box-shadow:none;padding:0;margin:0}table{border:1.5px solid #000!important}td,th{border:1px solid #000!important}}</style></head><body><div class=no-print><div style="display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #0d47a1;padding-bottom:6px;margin-bottom:12px"><h3 style=margin:0;color:#0d47a1>NewGen eEducation : TGBIE &mdash; Malpractice Cases Register Generator</h3><span id=live-clock style=font-size:12px;font-weight:700;color:#444></span></div><p style=font-size:12px;color:#555;margin-bottom:15px>Fill in Centre &amp; Exam details below to generate the official <strong>Malpractice Cases Register</strong> covering booked candidate particulars, booked authority details, material seizures, and joint C.S. &amp; D.O. certifications.</p><div class=manual-input-grid><div class=input-group><label for=man-exam-type>Exam Type</label><select id=man-exam-type><option value=IPE>IPE (Annual)</option><option value=IPASE>IPASE (Advanced Supplementary)</option></select></div><div class=input-group><label for=man-exam-month-year>Exam Month &amp; Year</label><input id=man-exam-month-year placeholder="e.g., MARCH 2026"></div><div class=input-group><label for=man-centre-code>Centre Code</label><input id=man-centre-code placeholder="e.g., 44***"></div><div class=input-group><label for=man-college-name>Centre Name / College</label><input id=man-college-name placeholder="e.g., Govt. Junior College,_____"></div><div class=input-group><label for=man-dist-name>District</label><input id=man-dist-name placeholder="e.g., Bhadradri Kothagudem (44)"></div><div class=input-group><label for=man-cs-name>Name of Chief Supdt.</label><input id=man-cs-name placeholder="Enter CS Name"></div><div class=input-group><label for=man-do-name>Name of Deptl. Officer</label><input id=man-do-name placeholder="Enter DO Name"></div></div><div class=controls-section><button class="btn btn-gen" onclick=generateRegister()>Generate Malpractice Register</button><button class="btn btn-print" onclick=window.print()>Print Register</button></div></div><div id=output-container></div><script>function updateClock(){const e=(new Date).toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"medium"}),t=document.getElementById("live-clock");t&&(t.innerText=e)}function getFormattedTimestamp(){const e=new Date;return`${e.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})} | ${e.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:!0})}`}function getMetaInputs(){const e=document.getElementById("man-exam-type").value.trim(),t=document.getElementById("man-exam-month-year").value.trim(),n=document.getElementById("man-centre-code").value.trim(),o=document.getElementById("man-college-name").value.trim(),a=document.getElementById("man-dist-name").value.trim(),i=document.getElementById("man-cs-name").value.trim(),d=document.getElementById("man-do-name").value.trim();return{exam:`${e} ${t}`.trim(),centreCode:n||"______",collegeName:o||"________________________________________________",dist:a||"________________",csName:i||"________________________",doName:d||"________________________",timestamp:getFormattedTimestamp()}}function renderRegisterHtml(e){let t="";for(let e=1;e<=12;e++)t+=`\n            <tr class="data-row">\n                <td>${e}</td>\n                <td></td>\n                <td></td>\n                <td></td>\n                <td></td>\n                <td></td>\n                <td></td>\n                <td></td>\n                <td></td>\n                <td></td>\n                <td></td>\n                <td></td>\n            </tr>`;return`\n        <div class="sheet-container">\n            <div class="top-branding-bar">\n                <div class="header-datetime"><strong>Generated on:</strong> ${e.timestamp}</div>\n            </div>\n            <div class="header-titles">\n                <h2>Telangana Board of Intermediate Education, Hyderabad</h2>\n                <h3>${e.exam.toUpperCase()}</h3>\n                <h4>REGISTER OF MALPRACTICE CASES BOOKED AT THE EXAMINATION CENTRE</h4>\n            </div>\n            <div class="details-grid">\n                <div><strong>Centre Code:</strong> ${e.centreCode}</div>\n                <div style="grid-column: span 2;"><strong>Name of the Centre:</strong> ${e.collegeName}</div>\n                <div><strong>District:</strong> ${e.dist}</div>\n                <div><strong>Name of CS:</strong> ${e.csName}</div>\n                <div><strong>Name of DO:</strong> ${e.doName}</div>\n            </div>\n            <table>\n                <colgroup>\n                    <col style="width: 3.5%;">\n                    <col style="width: 7%;">\n                    <col style="width: 10%;">\n                    <col style="width: 12%;">\n                    <col style="width: 13%;">\n                    <col style="width: 10%;">\n                    <col style="width: 7%;">\n                    <col style="width: 11%;">\n                    <col style="width: 12.5%;">\n                    <col style="width: 4.5%;">\n                    <col style="width: 4.5%;">\n                    <col style="width: 5%;">\n                </colgroup>\n                <thead>\n                    <tr>\n                        <th>Sl.<br>No.</th>\n                        <th>Date &amp;<br>Session</th>\n                        <th>Registered No.<br><span style="font-size:7.5px; font-weight:normal;">(10 Digits)</span></th>\n                        <th>Name of the<br>Candidate</th>\n                        <th>Parent College Name &amp; Code</th>\n                        <th>Subject &amp;<br>Paper Code</th>\n                        <th>Answer Book<br>&amp; OMR Sl. No.</th>\n                        <th>Booked by<br><span style="font-size:7px; font-weight:normal;">(Invigilator / Flying / CS / DO / Squad)</span></th>\n                        <th>Nature of Malpractice &amp;<br>Material Seized<br><span style="font-size:7px; font-weight:normal;">(Chits / Mobile / Impersonation)</span></th>\n                        <th>Logged in<br>m-Services<br>App (Y/N)</th>\n                        <th>Second<br>Ans Book<br>Issued?</th>\n                        <th>Joint Initials<br>(CS &amp; DO)</th>\n                    </tr>\n                    <tr>\n                        <th class="col-num">(1)</th>\n                        <th class="col-num">(2)</th>\n                        <th class="col-num">(3)</th>\n                        <th class="col-num">(4)</th>\n                        <th class="col-num">(5)</th>\n                        <th class="col-num">(6)</th>\n                        <th class="col-num">(7)</th>\n                        <th class="col-num">(8)</th>\n                        <th class="col-num">(9)</th>\n                        <th class="col-num">(10)</th>\n                        <th class="col-num">(11)</th>\n                        <th class="col-num">(12)</th>\n                    </tr>\n                </thead>\n                <tbody>\n                    ${t}\n                </tbody>\n            </table>\n            <div class="instructions">\n                <strong>Important Instructions for Chief Superintendent &amp; Departmental Officer:</strong>\n                <ol>\n                    <li><strong>Seizure &amp; Second Answer Book:</strong> Seize the incriminating material and the original answer book immediately upon detecting malpractice. Issue a fresh (second) answer booklet to the candidate with a clear endorsement on top: <em>"Second Answer Book issued due to Malpractice"</em> if the candidate wishes to continue writing.</li>\n                    <li><strong>Candidate Statement &amp; Reports:</strong> Obtain the candidate's written explanation on the prescribed proforma. If the candidate refuses to give a statement, record the fact duly attested by the Invigilator, Chief Superintendent, and Departmental Officer.</li>\n                    <li><strong>Digital Reporting:</strong> Every malpractice case booked must be reported online through the <strong>TGBIE m-Services Mobile App</strong> on the day of the examination itself before 2:00 PM (Forenoon session) / 6:00 PM (Afternoon session).</li>\n                    <li><strong>Despatch of MP Bundles:</strong> Malpractice answer scripts, seized materials, invigilator/squad reports, candidate explanations, and proforma must be packed in a separate cloth-lined cover, sealed jointly by CS &amp; DO, and dispatched to the Joint Secretary (Exams), TGBIE, Hyderabad.</li>\n                </ol>\n            </div>\n            <div class="footer-signatures">\n                <div>Signature of the Departmental Officer (D.O.)</div>\n                <div>Signature of the Additional Chief Superintendent</div>\n                <div>Signature of the Chief Superintendent (C.S.)</div>\n            </div>\n        </div>`}function generateRegister(){const e=getMetaInputs();document.getElementById("output-container").innerHTML=renderRegisterHtml(e)}setInterval(updateClock,1e3),updateClock(),window.addEventListener("DOMContentLoaded",(()=>{generateRegister()}))</script></body></html>
